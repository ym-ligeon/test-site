<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page 2 — Site de test</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #38bdf8;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 40px;
    max-width: 480px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  h1 {
    margin: 0 0 8px;
    font-size: 1.8rem;
    color: var(--accent);
  }
  p {
    color: var(--muted);
    line-height: 1.6;
  }
  .badge {
    display: inline-block;
    margin-top: 16px;
    padding: 6px 14px;
    background: rgba(56, 189, 248, 0.15);
    border: 1px solid var(--accent);
    border-radius: 999px;
    font-size: 0.85rem;
    color: var(--accent);
  }
  .back-link {
    display: inline-block;
    margin-top: 24px;
    color: var(--muted);
    text-decoration: none;
    border-bottom: 1px solid var(--muted);
    padding-bottom: 2px;
    font-size: 0.9rem;
  }
  .back-link:hover {
    color: var(--accent);
    border-color: var(--accent);
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Deuxième page 📄</h1>
    <p>Si tu vois cette page, le lien depuis la page d'accueil fonctionne — la navigation entre plusieurs pages marche bien sur GitHub Pages.</p>
    <span class="badge">Page 2 chargée</span>
    <br>
    <a class="back-link" href="index.html">← Retour à la page d'accueil</a>
  </div>
</body>
</html>
